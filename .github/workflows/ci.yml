name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Odin nightly oglyph is developed against (same pin as ovg).
  ODIN_VERSION: dev-2026-10

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Odin
        id: odin-cache
        uses: actions/cache@v4
        with:
          path: ~/.odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ env.ODIN_VERSION }}-v1

      - name: Install Odin
        if: steps.odin-cache.outputs.cache-hit != 'true'
        run: |
          case "$RUNNER_OS" in
            Linux) asset="odin-linux-amd64-$ODIN_VERSION.tar.gz" ;;
            macOS) asset="odin-macos-arm64-$ODIN_VERSION.tar.gz" ;;
          esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/odin.tar.gz" \
            "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/$asset"
          mkdir -p ~/.odin
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C ~/.odin --strip-components=1

      - name: Set up Odin
        run: |
          echo "$HOME/.odin" >> "$GITHUB_PATH"
          echo "ODIN_ROOT=$HOME/.odin" >> "$GITHUB_ENV"

      - name: Test
        run: |
          mkdir -p build
          odin test font -vet -strict-style -out:build/font_test
          odin test shape -vet -strict-style -out:build/shape_test
          # The HarfBuzz comparison needs libharfbuzz to run; it is
          # type-checked here.
          odin check tools/shape_corpus -vet -strict-style
          odin check tools/mascot -vet -strict-style
